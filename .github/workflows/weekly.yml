name: Finalize weekly ecosystem data

on:
  schedule:
    - cron: "20 4 * * 2" # Tuesday 12:20 Asia/Shanghai
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "collector.py"
      - "classification.py"
      - "weekly_dashboard.py"
      - "github_collector.py"
      - "github_dashboard.py"
      - "dashboard/usage.py"
      - "dashboard/run_daily.py"
      - ".github/workflows/weekly.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-dashboard-publish
  cancel-in-progress: false

jobs:
  collect-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install collector dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect Token, Hugging Face and GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m dashboard.run_daily --scope weekly --repo "$GITHUB_REPOSITORY"
      - name: Publish weekly archive in monthly release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          STAMP=$(python -c "import json; print(json.load(open('site/data/manifest.json'))['snapshot_date'].replace('-', ''))")
          TAG="market-${STAMP:0:4}-${STAMP:4:2}"
          FILE="dist/daily_snapshot_$STAMP.tar.gz"
          cp dist/storage-report.json "dist/storage_report_$STAMP.json"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "AI market data ${STAMP:0:6}" --notes "Validated daily and weekly snapshots." --latest=false
          gh release upload "$TAG" "$FILE" "dist/storage_report_$STAMP.json" --clobber
      - name: Report source health and storage
        run: python scripts/run_summary.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1

  deploy-dashboard:
    needs: collect-weekly
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment


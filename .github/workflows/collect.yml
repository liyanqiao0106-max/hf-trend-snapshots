name: Collect daily market data

on:
  schedule:
    - cron: "48 7 * * *" # 15:48 Asia/Shanghai, including weekends
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "config/**"
      - "site/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/collect.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-dashboard-publish
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: history/http-cache
          key: http-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: http-cache-${{ runner.os }}-
      - name: Install collector dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect daily market modules
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m dashboard.run_daily --scope daily --repo "$GITHUB_REPOSITORY"
      - name: Publish monthly market archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          STAMP=$(python -c "import json; print(json.load(open('site/data/manifest.json'))['snapshot_date'].replace('-', ''))")
          TAG="market-${STAMP:0:4}-${STAMP:4:2}"
          FILE="dist/daily_snapshot_$STAMP.tar.gz"
          cp dist/storage-report.json "dist/storage_report_$STAMP.json"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "AI market data ${STAMP:0:6}" --notes "Validated daily market snapshots. No credentials or full news articles." --latest=false
          gh release upload "$TAG" "$FILE" "dist/storage_report_$STAMP.json" --clobber
      - name: Report source health and storage
        run: python scripts/run_summary.py
      - name: Retain 90 days of market assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prune_daily_releases.py --repo "$GITHUB_REPOSITORY" --apply
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1

  deploy-dashboard:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

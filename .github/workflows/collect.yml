name: Collect daily AI sources

on:
  schedule:
    - cron: "0 4 * * *" # 12:00 Asia/Shanghai, every day including weekends
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-ai-dashboard
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free collector dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect and build independent modules
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m dashboard.run_daily --repo "$GITHUB_REPOSITORY"
      - name: Publish compact daily snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          STAMP=$(python -c "import json; print(json.load(open('site/data/inventory.json'))['snapshot_date'].replace('-', ''))")
          TAG="daily-snapshot-$STAMP"
          FILE="dist/daily_snapshot_$STAMP.tar.gz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" dist/storage-report.json --clobber
          else
            gh release create "$TAG" "$FILE" dist/storage-report.json --title "AI daily snapshot $STAMP" --notes "Validated source snapshots. No credentials, model weights or full news articles." --latest=false
          fi
      - name: Report source health and storage
        run: python scripts/run_summary.py
      - name: Retain 90 days of daily snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prune_daily_releases.py --repo "$GITHUB_REPOSITORY" --apply
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1

  deploy-dashboard:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment


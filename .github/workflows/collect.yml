name: Collect Hugging Face model snapshot

on:
  schedule:
    - cron: "30 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hf-model-snapshot
  cancel-in-progress: false

jobs:
  collect:
    outputs:
      dashboard_ready: ${{ steps.dashboard.outputs.ready }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install collector
        run: python -m pip install -r requirements.txt

      - name: Collect and validate snapshot
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python collector.py --output-dir dist

      - name: Read release metadata
        id: meta
        shell: bash
        run: cat dist/release.env >> "$GITHUB_OUTPUT"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: snapshot-${{ steps.meta.outputs.stamp }}
          DATA_FILE: dist/${{ steps.meta.outputs.data_file }}
          MANIFEST_FILE: dist/${{ steps.meta.outputs.manifest_file }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DATA_FILE" "$MANIFEST_FILE" --clobber
          else
            gh release create "$TAG" "$DATA_FILE" "$MANIFEST_FILE" \
              --title "Hugging Face snapshot ${{ steps.meta.outputs.stamp }}" \
              --notes "Official Hugging Face Hub API model metadata snapshot." \
              --latest=false
          fi

      - name: Keep the newest 52 snapshot releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t OLD_TAGS < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq '.[].tag_name' | grep '^snapshot-' | sort -r | tail -n +53
          )
          for tag in "${OLD_TAGS[@]}"; do
            gh release delete "$tag" --yes --cleanup-tag
          done

      - name: Build dashboard data
        id: dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          python weekly_dashboard.py \
            --current-dir dist \
            --repo "$GITHUB_REPOSITORY" \
            --cache-dir history \
            --output site/data/hugging-face/latest.json
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$STATUS" -eq 3 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Dashboard is waiting for three weekly snapshots."
          else
            exit "$STATUS"
          fi

      - name: Configure GitHub Pages
        if: steps.dashboard.outputs.ready == 'true'
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        if: steps.dashboard.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-dashboard:
    needs: collect
    if: needs.collect.outputs.dashboard_ready == 'true'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4

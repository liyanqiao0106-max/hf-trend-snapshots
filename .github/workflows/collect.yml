name: Collect Hugging Face model snapshot

on:
  schedule:
    - cron: "30 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hf-model-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install collector
        run: python -m pip install -r requirements.txt

      - name: Collect and validate snapshot
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python collector.py --output-dir dist

      - name: Read release metadata
        id: meta
        shell: bash
        run: cat dist/release.env >> "$GITHUB_OUTPUT"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: snapshot-${{ steps.meta.outputs.stamp }}
          DATA_FILE: dist/${{ steps.meta.outputs.data_file }}
          MANIFEST_FILE: dist/${{ steps.meta.outputs.manifest_file }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DATA_FILE" "$MANIFEST_FILE" --clobber
          else
            gh release create "$TAG" "$DATA_FILE" "$MANIFEST_FILE" \
              --title "Hugging Face snapshot ${{ steps.meta.outputs.stamp }}" \
              --notes "Official Hugging Face Hub API model metadata snapshot." \
              --latest=false
          fi

      - name: Keep the newest 16 snapshot releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t OLD_TAGS < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq '.[].tag_name' | grep '^snapshot-' | sort -r | tail -n +17
          )
          for tag in "${OLD_TAGS[@]}"; do
            gh release delete "$tag" --yes --cleanup-tag
          done
